<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>HN Ranking Analysis · 泳装榜单分析</title>
  <link rel="stylesheet" href="styles.css?v=c83f3c7d3b02">
</head>
<body>
  <div id="auth-gate" class="auth-gate">
    <form id="auth-form" class="auth-box">
      <div class="auth-mark">榜</div>
      <h1>HN Ranking Analysis</h1>
      <p>请输入团队访问密码</p>
      <label class="sr-only" for="auth-pass">团队访问密码</label>
      <input id="auth-pass" type="password" placeholder="访问密码" autocomplete="current-password">
      <button class="btn btn-primary" type="submit">
        <i data-lucide="arrow-right"></i>
        <span>进入榜单库</span>
      </button>
      <p id="auth-error" class="auth-error" hidden>密码错误，请重试</p>
    </form>
  </div>

  <div id="app" class="app" hidden>
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">榜</div>
        <div class="brand-copy">
          <h1>HN Ranking Analysis</h1>
          <p>Amazon US Swimwear · 周度榜单只读快照</p>
        </div>
      </div>
      <div class="topbar-meta">
        <span class="status-pill" id="period-pill">加载中</span>
        <span class="status-pill muted" id="generated-at">-</span>
      </div>
    </header>

    <nav class="view-tabs" aria-label="榜单视图">
      <button class="view-tab is-active" type="button" data-view="rankings">
        <i data-lucide="bar-chart-3"></i>
        <span>榜单数据</span>
      </button>
      <button class="view-tab" type="button" data-view="insights">
        <i data-lucide="files"></i>
        <span>汇总报告</span>
      </button>
      <button class="view-tab" type="button" data-view="compare">
        <i data-lucide="git-compare"></i>
        <span>跨期对比</span>
      </button>
    </nav>

    <main>
      <section id="rankings-view">
        <div class="card ranking-controls">
          <div class="ranking-control-row">
            <div class="seg-tabs" id="category-tabs" aria-label="子类目"></div>
            <div class="seg-tabs" id="type-tabs" aria-label="榜单类型">
              <button type="button" data-type="bsr" class="is-active">
                <i data-lucide="flame"></i>热卖榜 BSR
              </button>
              <button type="button" data-type="new">
                <i data-lucide="sparkles"></i>新品榜 NEW
              </button>
            </div>
            <div class="period-control">
              <span>数据期</span>
              <select id="period-select"></select>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="ranking-card-head">
            <h2 id="ranking-title">榜单加载中</h2>
            <div class="seg-tabs" id="mode-tabs" aria-label="展示方式">
              <button type="button" data-mode="grid" class="is-active" data-lucide-icon="image">
                <i data-lucide="image"></i>图片模式
              </button>
              <button type="button" data-mode="table" data-lucide-icon="table-2">
                <i data-lucide="table-2"></i>表格模式
              </button>
            </div>
          </div>
          <div id="ranking-content" class="ranking-content"></div>
        </div>
      </section>

      <section id="insights-view" class="view-hidden">
        <div class="card">
          <h2><i data-lucide="history"></i>汇总报告</h2>
          <p class="hint">默认展示最新一期，可切换数据期查看历史汇总</p>
          <div class="report-filter">
            <span>数据期</span>
            <select id="report-period-filter">
              <option value="">全部</option>
            </select>
          </div>
          <div id="report-list"></div>
        </div>
        <div id="insights-content"></div>
      </section>

      <section id="compare-view" class="view-hidden">
        <div class="section-heading insights-heading">
          <div>
            <p class="eyebrow">任意期指标 · ASIN 异动 · 多期趋势</p>
            <h2>跨期对比</h2>
          </div>
          <span class="file-chip" id="compare-period-count"></span>
        </div>
        <div id="compare-content"></div>
      </section>
    </main>

    <div id="load-status" class="load-status" hidden></div>
    <div id="toast-root"></div>
  </div>

  <script src="vendor/lucide.min.js"></script>
  <script src="vendor/echarts.min.js"></script>
  <script src="ui-common.js?v=c83f3c7d3b02"></script>
  <script src="report-viewer.js?v=c83f3c7d3b02"></script>
  <script src="compare-viewer.js?v=c83f3c7d3b02"></script>
  <script src="app.js?v=c83f3c7d3b02"></script>
</body>
</html>
